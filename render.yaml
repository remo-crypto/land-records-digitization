services:
  - type: web
    name: sih-land-records
    runtime: python
    buildCommand: |
      apt-get install -y tesseract-ocr poppler-utils libgl1
      pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
